# Ustaxona frontend Nginx: SPA + /api, /admin backend'ga proxy, /media va /static volume'dan

# Oldida Traefik (HTTPS) bo'lsa uning X-Forwarded-Proto'sini saqlaymiz, aks holda o'z sxemamiz.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API va admin — Django backend'ga
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Dinamik sitemap va robots.txt (domen SITE_URL'dan) — Django generatsiya qiladi
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Media va statika — backend bilan umumiy Docker volume'lardan (docker-compose.yml).
    # Media fayl nomi almashtirilganda o'zgarmasligi mumkin — immutable EMAS.
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # collectstatic fayllari — admin CSS/JS
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Vite build'dagi hash'li fayllar — hech qachon o'zgarmaydi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: index.html keshlanmaydi — yangi deploy darhol ko'rinadi
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
